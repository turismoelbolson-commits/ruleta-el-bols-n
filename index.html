<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ruleta Turística · El Bolsón</title>
<style>
:root{--green:#075b3c;--green2:#0a7449;--cream:#fff9ed}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#dff3ff,#c5dfdf 42%,#ead8b6);color:#173e2e;min-height:100vh}
.app{max-width:1100px;margin:auto;min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center}
.brand{font-size:clamp(30px,6vw,58px);font-weight:900;margin:2px 0}.tag{font-size:clamp(15px,2.6vw,25px);font-weight:700;text-align:center;margin-bottom:8px}
.card{width:min(94vw,760px);background:#ffffffdd;border-radius:28px;padding:10px 10px 22px;box-shadow:0 12px 35px #0003;text-align:center}
.wheelwrap{position:relative;width:min(82vw,650px);height:min(82vw,650px);margin:4px auto}
#wheel{width:100%;height:100%;transition:transform 4.7s cubic-bezier(.12,.75,.15,1);filter:drop-shadow(0 9px 7px #0005)}
.pointer{position:absolute;z-index:4;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:58px solid #d62929;filter:drop-shadow(0 3px 2px #0006)}
.center{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:#8b5927;border:7px solid #d9a14e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:29px}
button{border:0;border-radius:20px;padding:17px 42px;font-size:clamp(23px,4vw,38px);font-weight:900;background:var(--green);color:#fff;box-shadow:0 7px 0 #04422c;touch-action:manipulation}
button:active{transform:translateY(5px);box-shadow:0 2px 0 #04422c}
button:disabled{opacity:.55}
#result{min-height:54px;margin:20px 8px 5px;font-size:clamp(22px,4vw,36px);font-weight:900}
#voucher{display:none;margin:8px auto;padding:18px;max-width:600px;background:var(--cream);border:3px dashed #9a6b2f;border-radius:18px}
.code{font-size:clamp(26px,5vw,46px);font-weight:900;letter-spacing:3px;margin:8px}
.small{font-size:14px;color:#555}.admin{margin-top:14px}.admin button{font-size:15px;padding:10px 15px;box-shadow:none;background:#555}
#panel{display:none;width:min(94vw,760px);margin-top:12px;background:#fffffff5;border-radius:18px;padding:18px;box-shadow:0 8px 25px #0003}
.row{display:grid;grid-template-columns:1fr 1fr 1fr 90px;gap:7px;margin:7px 0}
input{min-width:0;padding:11px;border:1px solid #aaa;border-radius:9px;font-size:16px}
.adminactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.adminactions button{font-size:16px;padding:11px 15px}
.history{margin-top:15px;max-height:220px;overflow:auto;text-align:left;font-size:14px}
.history div{padding:7px;border-bottom:1px solid #ddd}
@media(max-width:600px){.row{grid-template-columns:1fr 1fr}.row input:last-of-type{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">El Bolsón</div>
  <div class="tag">NATURALEZA · SABORES · EXPERIENCIAS</div>
  <div class="card">
    <div class="wheelwrap">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="0 0 500 500" role="img"></svg>
      <div class="center">🏔️</div>
    </div>
    <button id="spin">↻ GIRAR</button>
    <div id="result"></div>
    <div id="voucher">
      <div>🎟️ TU VOUCHER</div>
      <div class="code" id="code"></div>
      <div id="prize"></div>
      <div class="small">Presentá este código para hacer efectivo tu premio.</div>
    </div>
  </div>

  <div class="admin">
    <button id="toggle">⚙️ Modo administrador</button>
  </div>
  <div id="panel">
    <h3>Administrar premios y vouchers</h3>
    <p class="small">Columnas: Premio · Código/prefijo · Cantidad disponible · Activo (1/0). Si el premio se agota, queda desactivado.</p>
    <div id="inputs"></div>
    <div class="adminactions">
      <button id="save">Guardar cambios</button>
      <button id="add">+ Agregar premio</button>
      <button id="clearHist">Borrar historial</button>
    </div>
    <div class="history"><b>Premios entregados en esta tablet</b><div id="hist"></div></div>
  </div>
</div>

<script>
const KEY="bolson_ruleta_v3", HIST="bolson_ruleta_hist";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||[
 {name:"Voucher gastronómico",prefix:"GASTRO",qty:10,active:1},
 {name:"10% OFF en excursión",prefix:"EXCUR",qty:10,active:1},
 {name:"Producto regional",prefix:"REGIO",qty:10,active:1},
 {name:"Souvenir de El Bolsón",prefix:"SOUVE",qty:10,active:1},
 {name:"Voucher alojamiento",prefix:"ALOJA",qty:5,active:1},
 {name:"Experiencia turística",prefix:"EXPER",qty:5,active:1},
 {name:"Premio sorpresa",prefix:"SORPR",qty:10,active:1},
 {name:"10% OFF",prefix:"OFF10",qty:10,active:1},
 {name:"Regalo especial",prefix:"REGAL",qty:5,active:1},
 {name:"¡Volvé a girar!",prefix:"OTRO",qty:999,active:1}
];
let rotation=0, spinning=false;
const colors=["#efc43f","#4b9a37","#22aab0","#7651a8","#eb4e4a","#2689c9","#7bb73e","#e14d45","#6655b0","#4a9e3e"];

function polar(a,r){return [250+r*Math.cos(a),250+r*Math.sin(a)]}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function draw(){
 const svg=document.getElementById("wheel");
 svg.innerHTML="";
 const n=data.length;
 const step=2*Math.PI/n;
 const start=-Math.PI/2-step/2;

 data.forEach((d,i)=>{
  const a0=start+i*step;
  const a1=a0+step;
  const [x0,y0]=polar(a0,242);
  const [x1,y1]=polar(a1,242);

  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d","M250 250L"+x0+" "+y0+"A242 242 0 0 1 "+x1+" "+y1+"Z");
  path.setAttribute("fill",colors[i%colors.length]);
  path.setAttribute("stroke","#fff");
  path.setAttribute("stroke-width","3");
  svg.appendChild(path);

  const mid=a0+step/2;
  const [tx,ty]=polar(mid,165);

  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",tx);
  t.setAttribute("y",ty);
  t.setAttribute("text-anchor","middle");
  t.setAttribute("dominant-baseline","middle");
  t.setAttribute("transform","rotate("+(mid*180/Math.PI+90)+" "+tx+" "+ty+")");
  t.setAttribute("fill","#fff");
  t.setAttribute("font-size",n>10?"11":"15");
  t.setAttribute("font-weight","900");
  t.setAttribute("font-family","Arial,sans-serif");

let words=d.name.split(" ");
let lines=[];
let line="";

words.forEach(word=>{
  let test=(line+" "+word).trim();
  if(test.length<=12){
    line=test;
  }else{
    if(line) lines.push(line);
    line=word;
  }
});

if(line) lines.push(line);

if(lines.length>2){
  lines=lines.slice(0,2);
  lines[1]+="…";
}

const lineHeight=13;
const startY=ty-((lines.length-1)*lineHeight/2);

lines.forEach((txt,j)=>{
  const span=document.createElementNS("http://www.w3.org/2000/svg","tspan");
  span.setAttribute("x",tx);
  span.setAttribute("y",startY+j*lineHeight);
  span.textContent=txt;
  t.appendChild(span);
});
  svg.appendChild(t);
 });
}
function inputs(){
 const box=document.getElementById("inputs");box.innerHTML="";
 data.forEach((d,i)=>{let r=document.createElement("div");r.className="row";
 r.innerHTML=`<input placeholder="Premio" value="${esc(d.name)}" data-k="name" data-i="${i}">
 <input placeholder="Prefijo código" value="${esc(d.prefix)}" data-k="prefix" data-i="${i}">
 <input type="number" min="0" placeholder="Cantidad" value="${d.qty}" data-k="qty" data-i="${i}">
 <input type="number" min="0" max="1" placeholder="1=activo" value="${d.active}" data-k="active" data-i="${i}">`;
 box.appendChild(r)});
}
function saveInputs(){
 document.querySelectorAll("#inputs input").forEach(x=>{let i=+x.dataset.i,k=x.dataset.k;data[i][k]=k==="qty"||k==="active"?+x.value:x.value});
 localStorage.setItem(KEY,JSON.stringify(data));draw();inputs();
}
function eligible(){return data.map((d,i)=>({d,i})).filter(x=>x.d.active && x.d.qty>0)}
function makeCode(prefix){
 const h=new Date().toISOString().slice(0,10).replaceAll("-","");
 const rnd=Math.random().toString(36).slice(2,7).toUpperCase();
 return `${prefix}-${h}-${rnd}`;
}
function hist(){const h=JSON.parse(localStorage.getItem(HIST)||"[]"),box=document.getElementById("hist");box.innerHTML=h.length?h.map(x=>`<div><b>${esc(x.code)}</b> · ${esc(x.prize)} · ${esc(x.date)}</div>`).join(""):"Todavía no hay premios registrados."}
document.getElementById("toggle").onclick=()=>{let p=document.getElementById("panel");p.style.display=p.style.display==="block"?"none":"block";inputs();hist()};
document.getElementById("save").onclick=()=>saveInputs();
document.getElementById("add").onclick=()=>{data.push({name:"Nuevo premio",prefix:"PREM",qty:1,active:1});inputs();draw()};
document.getElementById("clearHist").onclick=()=>{if(confirm("¿Borrar el historial de esta tablet?")){localStorage.removeItem(HIST);hist()}};
document.getElementById("spin").onclick=()=>{
 if(spinning)return;const choices=eligible();if(!choices.length){alert("No hay premios activos disponibles.");return}
 spinning=true;document.getElementById("spin").disabled=true;document.getElementById("voucher").style.display="none";document.getElementById("result").textContent="";
 const pick=choices[Math.floor(Math.random()*choices.length)],n=data.length,step=360/n,target=(360-(pick.i*step))%360,current=rotation%360,delta=(target-current+360)%360;
 rotation+=360*7+delta;document.getElementById("wheel").style.transform=`rotate(${rotation}deg)`;
 setTimeout(()=>{
  const code=makeCode(pick.d.prefix||"PREM");pick.d.qty--;if(pick.d.qty<=0)pick.d.active=0;localStorage.setItem(KEY,JSON.stringify(data));
  const h=JSON.parse(localStorage.getItem(HIST)||"[]");h.unshift({code,prize:pick.d.name,date:new Date().toLocaleString("es-AR")});localStorage.setItem(HIST,JSON.stringify(h));
  document.getElementById("result").textContent="🎉 ¡FELICITACIONES!";
  document.getElementById("prize").textContent=pick.d.name;
  document.getElementById("code").textContent=code;
  document.getElementById("voucher").style.display="block";
  draw();hist();spinning=false;document.getElementById("spin").disabled=false;
 },4850);
};
draw();
</script>
</body>
</html>
